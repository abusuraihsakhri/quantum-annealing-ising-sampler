[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-annealing-ising-sampler"
version = "2.0.0"
description = "D-Wave Style Quantum Annealing & Transverse Field Ising Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantum-annealing-ising-sampler = "quantum_annealing.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-annealing-ising-sampler"
Repository = "https://github.com/abusuraihsakhri/quantum-annealing-ising-sampler.git"
