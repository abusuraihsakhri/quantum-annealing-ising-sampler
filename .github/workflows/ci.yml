name: Tests and package checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Dependency validation
        run: python -m pip check
      - name: Python syntax
        run: python -m compileall -q agents quantum_annealing tests cli.py enrichment.py simulator.py
      - name: Static checks
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build

  browser-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser-side sampler
        run: node --test web/sampler.test.mjs
      - name: Verify browser assets in wheel
        run: |
          python - <<'PY'
          from glob import glob
          import zipfile
          wheels = glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          for expected in ("web/index.html", "web/audit.html", "web/sampler.mjs"):
              assert expected in names, expected
          PY
